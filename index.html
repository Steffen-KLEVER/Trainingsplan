<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KLEVER Trainingsplan-Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>:root{
  --blue:#0E71AC; --blue-d:#0A5C8C; --cyan:#18BAE8; --yellow:#F0E73F; --gold:#F0C529; --red:#B01A3A;
  --ink:#1E2B38; --muted:#5B6873; --line:#D9E3EB; --paper:#FFFFFF; --bg:#F3F6F9; --soft:#EAF2F8;
  --callout:#FCF3D4; --callout-ink:#8A6A12; --slate:#5B6873; --ok:#2E8B57; --okbg:#E6F4EC; --warnbg:#FDECEF;
  --heading:#0E71AC; --on-blue:#FFFFFF;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#E6EDF3; --muted:#9FB0BF; --line:#2B3F53; --paper:#16273A; --bg:#0E1B27; --soft:#1B3148;
    --callout:#3A3214; --callout-ink:#E9CF7A; --slate:#8FA3B5; --ok:#5CC08A; --okbg:#173A2A; --warnbg:#3D1A24;
    --heading:#5DB4EA; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --ink:#E6EDF3; --muted:#9FB0BF; --line:#2B3F53; --paper:#16273A; --bg:#0E1B27; --soft:#1B3148;
  --callout:#3A3214; --callout-ink:#E9CF7A; --slate:#8FA3B5; --ok:#5CC08A; --okbg:#173A2A; --warnbg:#3D1A24;
  --heading:#5DB4EA; color-scheme: dark;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html{ scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px); }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:"Source Sans 3","Source Sans Pro","Segoe UI",system-ui,-apple-system,sans-serif; font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased; }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--paper); }
button,input,select,textarea{ font:inherit; color:inherit; }
:focus-visible{ outline:3px solid var(--cyan); outline-offset:2px; }
img{ max-width:100%; }

/* Kopfzeile */
.top{ position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--paper); border-bottom:1px solid var(--line); }
.top-in{ max-width:1080px; margin:0 auto; display:flex; align-items:center; gap:14px; padding:10px 18px; }
.top .logo{ height:38px; width:auto; display:block; }
.top .logo-w{ display:none; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .top .logo-c{ display:none; } :root:not([data-theme="light"]) .top .logo-w{ display:block; } }
:root[data-theme="dark"] .top .logo-c{ display:none; } :root[data-theme="dark"] .top .logo-w{ display:block; }
.top .ttl{ font-weight:700; color:var(--heading); letter-spacing:.02em; font-size:15px; line-height:1.2; }
.top .ttl small{ display:block; color:var(--muted); font-weight:400; font-size:13px; letter-spacing:0; }
.top .sp{ flex:1; }
.savestate{ font-size:13px; color:var(--muted); white-space:nowrap; }
.savestate.dirty{ color:var(--red); font-weight:600; }
.savestate.ok{ color:var(--ok); }

.btn{ display:inline-flex; align-items:center; gap:8px; border:1.5px solid var(--blue); background:var(--blue); color:#fff; padding:9px 16px; border-radius:6px; font-weight:600; cursor:pointer; text-decoration:none; line-height:1.2; }
.btn:hover{ background:var(--blue-d); border-color:var(--blue-d); }
.btn.ghost{ background:transparent; color:var(--heading); border-color:var(--line); }
.btn.ghost:hover{ border-color:var(--blue); background:var(--soft); }
.btn.red{ background:var(--red); border-color:var(--red); }
.btn.sm{ padding:6px 11px; font-size:14px; }
.btn[disabled]{ opacity:.45; cursor:not-allowed; }
.linkbtn{ background:none; border:0; color:var(--heading); cursor:pointer; padding:0; font-weight:600; text-decoration:underline; text-underline-offset:3px; }

main{ max-width:1080px; margin:0 auto; padding:0 18px 80px; }

/* Kapitel-Opener (wie im Handbuch) */
.opener{ position:relative; overflow:hidden; background:var(--blue); color:var(--on-blue); border-radius:0 0 10px 10px; margin:0 -18px 28px; padding:46px 30px 30px; min-height:220px; }
.opener svg.shards{ position:absolute; top:0; right:0; width:min(520px,70%); height:auto; pointer-events:none; }
.opener .num{ font-size:76px; font-weight:800; color:var(--yellow); line-height:1; margin-bottom:6px; position:relative; }
.opener h1{ font-size:clamp(28px,4.4vw,42px); line-height:1.1; margin:0 0 10px; font-weight:800; position:relative; max-width:16em; }
.opener p{ margin:0; max-width:44em; color:#E3F1FA; position:relative; }
.opener .eyebrow{ font-size:12px; letter-spacing:.18em; color:var(--yellow); font-weight:700; margin-bottom:10px; position:relative; }
.opener .meta{ display:flex; flex-wrap:wrap; gap:8px 18px; margin-top:16px; font-size:14px; color:#E3F1FA; position:relative; }
.opener .meta b{ color:#fff; }
.opener .wlogo{ position:absolute; right:26px; bottom:20px; width:120px; opacity:.95; }
@media (max-width:640px){ .opener{ padding:34px 20px 24px; } .opener .wlogo{ display:none; } .opener .num{ font-size:60px; } }

/* Überschriften wie Handbuch: rote Nummer, blauer Titel */
h2.sec{ font-size:24px; color:var(--heading); margin:34px 0 12px; font-weight:700; line-height:1.2; }
h2.sec .n{ color:var(--red); margin-right:10px; }
h3.sub{ font-size:16px; color:var(--heading); margin:22px 0 8px; font-weight:700; }
.lead{ color:var(--muted); max-width:62em; margin:0 0 16px; }

.panel{ background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:20px; }
.callout{ background:var(--callout); border-radius:6px; padding:14px 18px; margin:16px 0; }
.callout .lbl{ font-size:12px; letter-spacing:.16em; font-weight:700; color:var(--callout-ink); margin-bottom:4px; }
.callout p{ margin:0; }

/* Formular */
.steps{ display:flex; gap:6px; flex-wrap:wrap; margin:0 0 22px; padding:0; list-style:none; counter-reset:st; }
.steps li button{ border:1px solid var(--line); background:var(--paper); color:var(--muted); border-radius:20px; padding:6px 12px 6px 8px; font-size:14px; cursor:pointer; display:flex; align-items:center; gap:7px; }
.steps li button .c{ width:22px; height:22px; border-radius:50%; display:inline-grid; place-items:center; background:var(--soft); color:var(--heading); font-weight:700; font-size:12px; }
.steps li button[aria-current="step"]{ border-color:var(--blue); color:var(--heading); font-weight:600; }
.steps li button[aria-current="step"] .c{ background:var(--blue); color:#fff; }
.steps li button.done .c{ background:var(--yellow); color:#5a4a00; }
.grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px 20px; }
.field{ display:flex; flex-direction:column; gap:6px; min-width:0; }
.field > span{ font-weight:600; font-size:15px; }
.field > span em{ font-style:normal; font-weight:400; color:var(--muted); font-size:13px; }
.field input[type=text],.field input[type=number],.field input[type=date],.field select,.field textarea,.inp{ border:1.5px solid var(--line); background:var(--paper); border-radius:6px; padding:9px 11px; width:100%; min-width:0; }
.field textarea{ min-height:84px; resize:vertical; }
.field input:focus,.field select:focus,.field textarea:focus,.inp:focus{ border-color:var(--blue); outline:none; box-shadow:0 0 0 3px rgba(24,186,232,.25); }
.help, .field > span.help{ font-size:13px; color:var(--muted); font-weight:400; }
.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{ position:relative; }
.chip input{ position:absolute; opacity:0; inset:0; cursor:pointer; }
.chip span{ display:inline-block; border:1.5px solid var(--line); border-radius:18px; padding:6px 13px; font-size:14px; background:var(--paper); cursor:pointer; user-select:none; }
.chip input:checked + span{ background:var(--blue); border-color:var(--blue); color:#fff; }
.chip input:focus-visible + span{ outline:3px solid var(--cyan); outline-offset:2px; }

.rate{ display:grid; grid-template-columns:minmax(150px,1.2fr) 2fr; gap:6px 16px; align-items:center; }
.rate .lbl{ font-weight:600; }
.seg{ display:flex; border:1.5px solid var(--line); border-radius:6px; overflow:hidden; width:max-content; max-width:100%; }
.seg button{ border:0; background:var(--paper); padding:7px 0; width:44px; cursor:pointer; border-right:1px solid var(--line); font-weight:600; color:var(--muted); }
.seg button:last-child{ border-right:0; }
.seg button[aria-pressed="true"]{ background:var(--blue); color:#fff; }
.scale-note{ display:flex; justify-content:space-between; font-size:12px; color:var(--muted); max-width:220px; }
@media (max-width:560px){ .rate{ grid-template-columns:1fr; } .rate .lbl{ margin-top:8px; } }

table.t{ width:100%; border-collapse:collapse; font-size:15px; }
table.t th{ background:var(--blue); color:#fff; text-align:left; font-weight:600; padding:9px 10px; }
table.t td{ border-bottom:1px solid var(--line); padding:8px 10px; vertical-align:middle; }
.tw{ overflow-x:auto; border-radius:6px; border:1px solid var(--line); background:var(--paper); }
.tw table.t th:first-child{ border-top-left-radius:5px; }
.switch{ display:inline-flex; align-items:center; gap:8px; cursor:pointer; }
.switch input{ width:20px; height:20px; accent-color:var(--blue); }
.formnav{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:28px; padding-top:18px; border-top:1px solid var(--line); flex-wrap:wrap; }
.err{ color:var(--red); font-weight:600; font-size:14px; }
.warnline{ background:var(--warnbg); border-left:4px solid var(--red); padding:10px 14px; border-radius:4px; margin:10px 0; font-size:15px; }
.fixrow{ display:grid; grid-template-columns:110px 1.4fr 90px 120px 1.6fr auto; gap:8px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
@media (max-width:760px){ .fixrow{ grid-template-columns:1fr 1fr; } .fixrow .full{ grid-column:1/-1; } }

/* Startseite */
.athletes{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; }
.acard{ background:var(--paper); border:1px solid var(--line); border-top:4px solid var(--blue); border-radius:6px; padding:16px; display:flex; flex-direction:column; gap:6px; }
.acard h3{ margin:0; color:var(--heading); font-size:19px; }
.acard .m{ color:var(--muted); font-size:14px; }
.acard .row{ display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
.bar{ height:6px; background:var(--soft); border-radius:3px; overflow:hidden; }
.bar > i{ display:block; height:100%; background:var(--yellow); }
.empty{ border:2px dashed var(--line); border-radius:8px; padding:26px; text-align:center; color:var(--muted); }

/* Plan */
.tabs{ display:flex; gap:4px; border-bottom:2px solid var(--line); margin:0 0 18px; overflow-x:auto; }
.tabs button{ border:0; background:none; padding:10px 14px; font-weight:600; color:var(--muted); cursor:pointer; border-bottom:3px solid transparent; margin-bottom:-2px; white-space:nowrap; }
.tabs button[aria-selected="true"]{ color:var(--heading); border-bottom-color:var(--red); }
.weeknav{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
.weeknav .wk{ font-weight:700; font-size:20px; color:var(--heading); min-width:9em; }
.weeknav .wk small{ display:block; font-size:13px; color:var(--muted); font-weight:400; }
.blockstrip{ display:flex; flex-wrap:wrap; gap:6px 16px; align-items:baseline; background:var(--paper); border:1px solid var(--line); border-left:5px solid var(--red); border-radius:6px; padding:12px 16px; margin-bottom:14px; }
.blockstrip b{ color:var(--heading); }
.blockstrip .k{ font-size:14px; color:var(--muted); }
.tag{ display:inline-block; font-size:12px; font-weight:700; padding:2px 8px; border-radius:10px; background:var(--soft); color:var(--heading); }
.tag.deload{ background:var(--callout); color:var(--callout-ink); }
.tag.taper{ background:var(--yellow); color:#4d4300; }

.day{ display:grid; grid-template-columns:104px 1fr; gap:14px; padding:12px 0; border-bottom:1px solid var(--line); }
.day .dl{ font-weight:700; color:var(--heading); line-height:1.2; }
.day .dl small{ display:block; font-weight:400; color:var(--muted); font-size:13px; }
.day.today .dl{ color:var(--red); }
.day.today .dl::after{ content:"heute"; display:inline-block; margin-top:4px; font-size:11px; font-weight:700; letter-spacing:.08em; background:var(--red); color:#fff; padding:1px 6px; border-radius:3px; }
.rest{ color:var(--muted); font-size:15px; padding:6px 0; }
@media (max-width:600px){ .day{ grid-template-columns:1fr; gap:6px; } }

.sess{ background:var(--paper); border:1px solid var(--line); border-left:6px solid var(--blue); border-radius:6px; padding:14px 16px; margin-bottom:10px; }
.sess.c-red{ border-left-color:var(--red); } .sess.c-gold{ border-left-color:var(--gold); } .sess.c-cyan{ border-left-color:var(--cyan); }
.sess.c-blue{ border-left-color:var(--blue); } .sess.c-slate{ border-left-color:var(--slate); } .sess.c-ink{ border-left-color:var(--ink); }
.sess.c-fixed{ border-left-color:var(--muted); background-image:repeating-linear-gradient(135deg,transparent 0 10px,rgba(91,104,115,.06) 10px 20px); }
.sess.dropped{ opacity:.55; }
.sess.dropped .st{ text-decoration:line-through; }
.sess.st-done{ box-shadow:inset 0 0 0 1px var(--ok); }
.sess.st-missed{ opacity:.7; }
.sess.flash{ animation:flash 1.6s ease-out 1; }
@keyframes flash{ 0%{ box-shadow:0 0 0 4px var(--yellow);} 100%{ box-shadow:0 0 0 0 transparent; } }
@media (prefers-reduced-motion:reduce){ .sess.flash{ animation:none; } }
.sh{ display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; }
.sh .st{ font-weight:700; font-size:17px; }
.sh .mt{ font-size:14px; color:var(--muted); }
.sh .sp{ flex:1; }
.sent{ margin:6px 0 0; }
.adj{ margin:8px 0 0; padding:0; list-style:none; display:flex; flex-direction:column; gap:4px; }
.adj li{ font-size:14px; background:var(--soft); border-radius:4px; padding:5px 9px; color:var(--heading); }
.adj li.y{ background:var(--callout); color:var(--callout-ink); }
.adj li.r{ background:var(--warnbg); color:var(--red); }
details.flow{ margin-top:10px; }
details.flow summary{ cursor:pointer; color:var(--heading); font-weight:600; font-size:15px; }
.parts{ margin:10px 0 0; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
.part{ display:grid; grid-template-columns:150px 54px 1fr; gap:10px; padding:9px 12px; border-bottom:1px solid var(--line); font-size:15px; }
.part:last-child{ border-bottom:0; }
.part .pt{ font-weight:600; }
.part .pm{ color:var(--muted); text-align:right; }
.part ul{ margin:0; padding-left:18px; }
@media (max-width:600px){ .part{ grid-template-columns:1fr auto; } .part ul{ grid-column:1/-1; } }

.fb{ margin-top:12px; padding-top:12px; border-top:1px dashed var(--line); display:flex; flex-direction:column; gap:10px; }
.fb .r1{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.tgl{ border:1.5px solid var(--line); background:var(--paper); border-radius:6px; padding:7px 12px; cursor:pointer; font-weight:600; font-size:14px; }
.tgl[aria-pressed="true"].done{ background:var(--ok); border-color:var(--ok); color:#fff; }
.tgl[aria-pressed="true"].miss{ background:var(--red); border-color:var(--red); color:#fff; }
.rpe{ display:flex; flex-wrap:wrap; gap:4px; align-items:center; }
.rpe .l{ font-size:14px; color:var(--muted); margin-right:6px; font-weight:600; }
.rpe button{ width:34px; height:34px; border-radius:50%; border:1.5px solid var(--line); background:var(--paper); cursor:pointer; font-weight:700; font-size:14px; }
.rpe button.tgt{ border-color:var(--blue); }
.rpe button[aria-pressed="true"]{ background:var(--blue); border-color:var(--blue); color:#fff; }
.amp{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.amp .l{ font-size:14px; color:var(--muted); font-weight:600; margin-right:4px; }
.amp button{ border:1.5px solid var(--line); background:var(--paper); border-radius:16px; padding:4px 11px; cursor:pointer; font-size:13px; font-weight:600; display:inline-flex; align-items:center; gap:6px; }
.amp button i{ width:10px; height:10px; border-radius:50%; display:inline-block; }
.amp button[aria-pressed="true"]{ border-color:var(--ink); }
.note-in{ border:1.5px solid var(--line); background:var(--paper); border-radius:6px; padding:7px 10px; width:100%; font-size:14px; }

/* Überblick */
.two{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
@media (max-width:820px){ .two{ grid-template-columns:1fr; } }
.timeline{ display:flex; gap:2px; margin:6px 0 4px; }
.timeline .tb{ height:38px; border-radius:3px; position:relative; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:#fff; overflow:hidden; cursor:pointer; border:0; padding:0; }
.timeline .tb.cur{ outline:3px solid var(--yellow); outline-offset:1px; z-index:1; }
.legend{ display:flex; flex-wrap:wrap; gap:6px 16px; font-size:13px; color:var(--muted); margin-top:10px; }
.legend i{ display:inline-block; width:12px; height:12px; border-radius:2px; margin-right:6px; vertical-align:-1px; }
.stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; }
.stat{ background:var(--paper); border:1px solid var(--line); border-radius:6px; padding:12px 14px; }
.stat b{ display:block; font-size:28px; color:var(--heading); line-height:1.1; }
.stat span{ font-size:13px; color:var(--muted); }
.log{ list-style:none; margin:0; padding:0; }
.log li{ padding:9px 0 9px 14px; border-left:3px solid var(--line); margin-left:4px; font-size:15px; }
.log li.move{ border-color:var(--blue); } .log li.up{ border-color:var(--ok); } .log li.down{ border-color:var(--gold); } .log li.warn{ border-color:var(--red); } .log li.drop{ border-color:var(--muted); }
.log li small{ display:block; color:var(--muted); font-size:12px; }
.ai{ white-space:pre-wrap; font-size:15px; }
svg text{ font-family:inherit; }

.toast{ position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:12px 18px; border-radius:8px; max-width:min(560px,92vw); font-size:15px; z-index:50; box-shadow:0 8px 24px rgba(0,0,0,.25); }
.toast ul{ margin:4px 0 0; padding-left:18px; }
.foot{ text-align:center; color:var(--muted); font-size:13px; margin-top:40px; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
.kv{ display:grid; grid-template-columns:200px 1fr; gap:6px 16px; font-size:15px; }
.kv dt{ color:var(--muted); } .kv dd{ margin:0; }
@media (max-width:560px){ .kv{ grid-template-columns:1fr; } .kv dd{ margin-bottom:6px; } }

@media (max-width:640px){
  .top-in{ padding:8px 14px; gap:10px; }
  .top .ttl{ display:none; }
  .top .logo{ height:32px; }
  .savestate.neutral{ display:none; }
  .savestate{ font-size:12px; }
}

/* Übungen */
.parts{ border:0; border-radius:0; overflow:visible; display:flex; flex-direction:column; gap:12px; }
section.part{ display:block; border:1px solid var(--line); border-radius:6px; padding:0; overflow:hidden; }
.ph{ display:flex; justify-content:space-between; align-items:baseline; background:var(--soft); padding:8px 12px; }
.ph .pt{ font-weight:700; color:var(--heading); }
.ph .pm{ color:var(--muted); font-size:14px; }
.exl{ list-style:none; margin:0; padding:0; }
.exl > li{ border-top:1px solid var(--line); padding:10px 12px; font-size:15px; }
.exl > li:first-child{ border-top:0; }
.exl li.nt{ color:var(--callout-ink); background:var(--callout); font-size:14px; }
.exl li.ex{ display:grid; grid-template-columns:30px 1fr; gap:8px; align-items:start; }
.exl li.ex.ok .exn{ text-decoration:line-through; text-decoration-color:var(--ok); text-decoration-thickness:2px; }
.exl li.ex.ok .exd{ opacity:.6; }
.ck{ position:relative; width:26px; height:26px; margin-top:1px; cursor:pointer; }
.ck input{ width:24px; height:24px; accent-color:var(--ok); cursor:pointer; margin:0; }
.exh{ display:flex; flex-wrap:wrap; gap:4px 10px; align-items:center; }
.exn{ font-weight:700; }
.dose{ color:var(--heading); font-size:14px; font-weight:600; background:var(--soft); border-radius:4px; padding:1px 7px; }
.tbtn{ margin-left:auto; display:inline-flex; align-items:center; gap:6px; border:1.5px solid var(--blue); color:var(--heading); background:var(--paper); border-radius:16px; padding:4px 11px; font-size:13px; font-weight:700; cursor:pointer; white-space:nowrap; }
.tbtn:hover{ background:var(--blue); color:#fff; }
.exd{ margin:4px 0 0; color:var(--muted); font-size:14px; line-height:1.45; }
.subex{ margin:6px 0 0; padding-left:20px; font-size:14px; color:var(--muted); display:flex; flex-direction:column; gap:4px; }
.subex b{ color:var(--ink); }
.prog{ display:inline-block; margin-left:8px; font-size:12px; font-weight:700; background:var(--soft); color:var(--heading); padding:2px 8px; border-radius:10px; }
.prog.full{ background:var(--okbg); color:var(--ok); }
.alldone{ margin-top:10px; background:var(--okbg); color:var(--ok); padding:9px 12px; border-radius:6px; font-weight:600; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
@media (max-width:600px){ .tbtn{ margin-left:0; } }

/* Timer */
.tmr{ position:fixed; inset:0; z-index:100; background:rgba(8,20,32,.6); display:flex; align-items:center; justify-content:center; padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px)); }
.tmr[hidden]{ display:none; }
.tmr-in{ width:min(520px,100%); max-height:100%; overflow:auto; background:var(--blue); color:#fff; border-radius:14px; padding:18px 22px 22px; text-align:center; position:relative; transition:background-color .3s; }
.tmr-in.k-rest{ background:#0B5A86; } .tmr-in.k-prep{ background:#5A4D0A; } .tmr-in.k-work{ background:#B01A3A; } .tmr-in.k-manual{ background:#0E71AC; } .tmr-in.k-done{ background:#1F6E45; }
@media (prefers-reduced-motion:reduce){ .tmr-in{ transition:none; } }
.tmr-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
.tmr-logo{ height:30px; }
.tmr-x{ background:rgba(255,255,255,.15); color:#fff; border:0; width:38px; height:38px; border-radius:50%; font-size:18px; cursor:pointer; }
.tmr-name{ font-size:22px; font-weight:800; line-height:1.2; }
.tmr-dose{ font-size:14px; opacity:.85; margin-top:2px; }
.tmr-kind{ margin-top:16px; font-size:13px; letter-spacing:.16em; text-transform:uppercase; font-weight:700; color:var(--yellow); }
.tmr-label{ font-size:19px; font-weight:700; margin-top:4px; }
.tmr-sub{ font-size:15px; opacity:.9; min-height:1.4em; }
.tmr-time{ font-size:clamp(72px,22vw,120px); font-weight:800; line-height:1; margin:10px 0 8px; font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
.tmr-bar{ height:8px; background:rgba(255,255,255,.2); border-radius:4px; overflow:hidden; margin:0 auto 12px; max-width:360px; }
.tmr-bar i{ display:block; height:100%; width:0; background:var(--yellow); }
.tmr-hint{ font-size:14px; opacity:.9; margin:0 auto 12px; max-width:340px; }
.tmr-next{ font-size:15px; opacity:.9; margin-bottom:14px; }
.tmr-ctl .btn.big{ font-size:22px; padding:14px 40px; min-width:220px; justify-content:center; background:#fff; color:#1E2B38; border-color:#fff; border-radius:40px; }
.tmr-ctl .btn.big:hover{ background:var(--yellow); border-color:var(--yellow); }
.tmr-ctl2{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:14px; }
.tmr-ctl2 .btn.ghost{ color:#fff; border-color:rgba(255,255,255,.45); background:transparent; }
.tmr-ctl2 .btn.ghost:hover{ background:rgba(255,255,255,.12); }
.tmr-meta{ margin-top:12px; font-size:13px; opacity:.8; }
.day > div, .exb, .sess, .parts, section.part{ min-width:0; }
.exd, .subex, .sent{ overflow-wrap:anywhere; }
@media (max-width:600px){ .tbtn{ white-space:normal; text-align:left; } .dose{ overflow-wrap:anywhere; } }

/* Nachtragen & PDF */
.tabsp{ flex:1; }
.tabs .pdfbtn{ border:1.5px solid var(--line); border-radius:6px; margin:4px 0 6px; padding:6px 12px; color:var(--heading); background:var(--paper); font-weight:600; white-space:nowrap; }
.tabs .pdfbtn:hover{ border-color:var(--blue); background:var(--soft); }
.addx{ border:1.5px dashed var(--line); background:transparent; color:var(--heading); border-radius:6px; padding:6px 12px; font-weight:600; font-size:14px; cursor:pointer; margin-top:2px; }
.addx:hover{ border-color:var(--blue); background:var(--soft); }
.addx.strong{ border-color:var(--gold); }
.xform{ background:var(--paper); border:1.5px solid var(--gold); border-radius:8px; padding:14px 16px; margin:6px 0 4px; }
.xf-h{ font-weight:700; color:var(--heading); margin-bottom:10px; }
.sess.extra{ background-image:linear-gradient(90deg, rgba(240,197,41,.10), transparent 60%); }
.modal{ position:fixed; inset:0; z-index:90; background:rgba(8,20,32,.55); display:flex; align-items:center; justify-content:center; padding:16px; }
.modal[hidden]{ display:none; }
.modal-in{ background:var(--paper); color:var(--ink); border-radius:12px; padding:22px; width:min(520px,100%); max-height:100%; overflow:auto; border-top:6px solid var(--red); }
.tgl.altb{ border-style:dashed; color:var(--heading); }
.tgl.altb[aria-expanded="true"]{ border-style:solid; border-color:var(--blue); background:var(--soft); }
.altmenu{ background:var(--soft); border-radius:6px; padding:10px 12px; }
.altmenu .l{ display:block; font-size:14px; font-weight:600; color:var(--heading); margin-bottom:8px; }
.altopt{ border:1.5px solid var(--line); background:var(--paper); border-radius:16px; padding:6px 12px; font-size:14px; font-weight:600; cursor:pointer; color:var(--ink); }
.altopt:hover{ border-color:var(--blue); }
.altopt.on{ background:var(--blue); border-color:var(--blue); color:#fff; }
.tag.alt{ background:var(--callout); color:var(--callout-ink); }
</style>
</head>

/* Welche Einheit ist in welcher Umgebung möglich? */
function mapAlt(type, env, perm) {
  if (env === 'home') return type === 'prehab_mob' || type === 'mobil' || type === 'regen' ? 'mobil' : 'home_bw';
  if (env === 'hangboard') {
    if (!perm.hb) return type === 'prehab_mob' ? 'mobil' : 'home_bw';
    if (['finger_max', 'limit', 'power', 'wk_sim', 'projekt', 'test', 'speed'].includes(type)) return 'finger_max';
    if (['pe_boulder', 'pe_route', 'pe_hang'].includes(type)) return 'pe_hang';
    if (type === 'prehab_mob' || type === 'regen' || type === 'mobil') return type === 'regen' ? 'regen' : 'prehab_mob';
    return 'athletik';
  }
  const m = {
    boulder: { finger_max: 'limit', pe_route: 'pe_boulder', projekt: 'limit', speed: 'power', pe_hang: 'pe_boulder', home_bw: 'athletik', mobil: 'prehab_mob' },
    system: { finger_max: 'limit', pe_route: 'pe_boulder', aerob: 'arc', volumen: 'technik', wk_sim: 'limit', projekt: 'limit', speed: 'power', test: 'limit', pe_hang: 'pe_boulder', home_bw: 'athletik', mobil: 'prehab_mob' },

  }[env] || {};
  return m[type] || type;
}
/* Vorschlag für fixe Termine bzw. Ersatz bei Ausfall */
function proxyType(fx, block, perm) {
  if (!fx) return null;
  const t = fx.type, it = fx.intensity;
  if (t === 'athletik') return it === 'leicht' ? 'prehab_mob' : 'athletik';
  if (t === 'gruppe' || t === 'fels') {
    if (it === 'hart') { const h = (block.types || []).find(x => TYPES[x] && TYPES[x].hard && !['finger_max', 'test', 'speed'].includes(x)); return t === 'fels' ? 'projekt' : (h || 'limit'); }
    return it === 'mittel' ? 'technik' : 'volumen';
  }
  if (t === 'wettkampf') return 'wk_sim';
  return null;
}
const EXTRA_KINDS = { bouldern_hart: 'Bouldern hart / Limit', bouldern_locker: 'Bouldern locker / Volumen', seil: 'Seilklettern', hangboard: 'Hangboard / Fingertraining', fels: 'Felsklettern', athletik: 'Athletik / Krafttraining', mobil: 'Mobilität / Prehab', sport: 'Andere Sportart', sonst: 'Sonstiges' };

function extraHard(e) { return EXTRA_FINGER.includes(e.kind) && (+e.rpe >= 7 || e.kind === 'bouldern_hart' || e.kind === 'hangboard'); }

/* ---------- Hilfen ---------- */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const r5 = v => Math.max(5, Math.round(v / 5) * 5);
function parseDate(s) { if (!s) return null; const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); }
function isoDate(d) { const z = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()); }
function mondayOf(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12); const wd = (x.getDay() + 6) % 7; return new Date(x.getTime() - wd * DAY_MS); }
function addDays(d, n) { const x = new Date(d.getTime() + n * DAY_MS); return new Date(x.getFullYear(), x.getMonth(), x.getDate(), 12); }
function dayDate(plan, idx) { return addDays(parseDate(plan.start), idx); }
function fmtDate(d) { return d.getDate() + '.' + (d.getMonth() + 1) + '.'; }
function fmtDay(plan, idx) { const d = dayDate(plan, idx); return WD[idx % 7] + ', ' + fmtDate(d); }
function todayIdx(plan) { const t = new Date(); const s = parseDate(plan.start); return Math.floor((new Date(t.getFullYear(), t.getMonth(), t.getDate(), 12) - s) / DAY_MS); }

/* ---------- Profil-Ableitungen ---------- */
function stageOf(age) {
  age = +age;
  if (age < 10) return 'grundlagen';
  if (age < 14) return 'aufbau';
  if (age < 18) return 'anschluss';
  return 'erwachsen';
}
const STAGE_LABEL = { grundlagen: 'Grundlagentraining', aufbau: 'Aufbautraining', anschluss: 'Anschlusstraining', erwachsen: 'Erwachsene / Hochleistung' };

function levelOf(p) {
  const b = +p.boulderMax, r = +p.routeMax;
  if (b >= 13 || r >= 15) return 'leistung';
  if (b >= 9 || r >= 10) return 'fortgeschritten';
  if (b < 0 && r < 0) return (+p.climbYears >= 4) ? 'fortgeschritten' : 'einsteiger';
  return 'einsteiger';
}
const LEVEL_LABEL = { einsteiger: 'Einsteiger:in', fortgeschritten: 'Fortgeschritten', leistung: 'Leistungsbereich' };

function permsOf(p) {
  const st = stageOf(p.age), lvl = levelOf(p), eq = p.equipment || [], cp = p.complaints || [];
  const fingerIssue = cp.includes('finger') || p.pain === 'rot';
  const growth = p.growth === 'ja';
  const hbBase = eq.includes('hangboard') && +p.climbYears >= 2 && !fingerIssue && !growth;
  return {
    st, lvl, fingerIssue, growth,
    hb: hbBase && (st === 'erwachsen' || st === 'anschluss'),
    hbLoaded: hbBase && st === 'erwachsen',
    campus: st === 'erwachsen' && lvl === 'leistung' && +p.climbYears >= 4 && eq.includes('campus') && !fingerIssue && !cp.includes('schulter'),
    weightedPull: +p.age >= 14 && (eq.includes('hantel') || eq.includes('kettlebell')),
    seil: eq.includes('halle_seil'),
    kb: eq.includes('kettlebell'), medball: eq.includes('medball'), band: eq.includes('theraband'),
    hantel: eq.includes('hantel'), bar: eq.includes('stange') || eq.includes('halle_boulder'),
    youth: st !== 'erwachsen'
  };
}

function weaknesses(p) {
  const r = p.ratings || {};
  return RATINGS.filter(([k]) => +r[k] <= 2).map(([k]) => k);
}
function strengths(p) {
  const r = p.ratings || {};
  return RATINGS.filter(([k]) => +r[k] >= 4).map(([k]) => k);
}

/* ---------- Blöcke (Mesozyklen) ---------- */
function blockDefs(p, perm) {
  const disc = p.mainDisc || 'boulder';
  const lead = disc === 'lead' || (disc === 'rock' && (p.disciplines || []).includes('lead'));
  const youngA = perm.st === 'aufbau' || perm.st === 'grundlagen';
  const B = {};
  if (youngA) {
    B.basis = { name: 'Technik & Koordination', mix: 'Bewegungsvielfalt, Fußtechnik, Gleichgewicht, Spiel', types: ['volumen', 'technik', 'athletik', 'arc'] };
    B.kraft = { name: 'Eigengewichtskraft & Technik', mix: 'Technikrepertoire, Eigengewichtskraft, Rumpf – Finger nur durch Klettern', types: ['technik', 'limit', 'athletik', 'volumen'] };
    B.power = { name: 'Dynamik & Koordination', mix: 'Koordinationssprünge, Dynamos, Laufstarts – spielerisch', types: ['power', 'technik', 'athletik', 'volumen'] };
    B.pe = { name: 'Kraftausdauer spielerisch', mix: 'Boulder-Zirkel, Routen mit Volumen, Vorstieg & Sturztraining', types: ['pe_boulder', 'technik', 'arc', 'athletik'] };
    B.leistung = { name: 'Wettkampf & Anwendung', mix: 'Erste Wettkämpfe, Onsight-Boulder, Taktik', types: ['wk_sim', 'technik', 'volumen', 'athletik'] };
  } else {
    B.basis = { name: 'Allgemeine Vorbereitung', mix: '40 % Technik/Volumen · 40 % Grundkraft · 20 % Ausdauer', types: ['technik', 'athletik', 'arc', 'volumen', 'prehab_mob'] };
    B.kraft = { name: 'Spezielle Vorbereitung I – Kraft', mix: '50 % Maximalkraft · 30 % Technik · 20 % Ausdauer', types: ['finger_max', 'technik', 'limit', 'arc', 'athletik'] };
    B.power = { name: 'Spezielle Vorbereitung II – Power', mix: '40 % Power · 40 % Bouldern · 20 % Erhalt', types: ['power', 'limit', 'technik', 'athletik', 'arc'] };
    B.pe = lead
      ? { name: 'Spezielle Vorbereitung III – Kraftausdauer', mix: '50 % Kraftausdauer · 30 % Kraft-Erhalt · 20 % Technik', types: ['pe_route', 'limit', 'aerob', 'technik', 'athletik'] }
      : { name: 'Spezielle Vorbereitung III – Kraftausdauer', mix: '50 % Kraftausdauer · 30 % Kraft-Erhalt · 20 % Technik', types: ['pe_boulder', 'finger_max', 'technik', 'arc', 'athletik'] };
    B.aerob = { name: 'Ausdauerbasis & Ökonomie', mix: 'Kapillarisierung, kritische Kraft, Technikvolumen', types: ['aerob', 'technik', 'finger_max', 'arc', 'athletik'] };
    const g = p.goalType;
    if (g === 'comp') B.leistung = { name: 'Wettkampfperiode', mix: 'niedriger Umfang, hohe Qualität: Wettkampfsimulation, Kraft-Erhalt, Taktik', types: lead ? ['wk_sim', 'pe_route', 'limit', 'technik', 'athletik'] : ['wk_sim', 'limit', 'power', 'technik', 'athletik'] };
    else if (g === 'rock') B.leistung = { name: 'Leistungsphase – Projekt', mix: 'Projektarbeit, Linkups, Kraft-Erhalt', types: ['projekt', 'limit', 'technik', lead ? 'pe_route' : 'power', 'athletik'] };
    else if (lead) B.leistung = { name: 'Leistungsphase Route', mix: 'Routenintervalle, Rotpunkt, Kraft-Erhalt', types: ['pe_route', 'limit', 'technik', 'aerob', 'athletik'] };
    else B.leistung = { name: 'Leistungsphase Bouldern', mix: 'Limit-Bouldern, Power, Kraftausdauer-Erhalt', types: ['limit', 'power', 'technik', 'pe_boulder', 'athletik'] };
  }
  // Speed ergänzen
  if ((p.disciplines || []).includes('speed')) {
    ['power', 'leistung'].forEach(k => { if (B[k]) { const t = B[k].types.slice(); t.splice(disc === 'speed' ? 0 : 2, 0, 'speed'); B[k] = Object.assign({}, B[k], { types: t }); } });
  }
  // Schwächen nach vorne ziehen (Handbuch 1.3: größte Schwäche zuerst)
  const weak = weaknesses(p);
  const map = { finger: ['finger_max', 'limit'], power: ['power'], pe: ['pe_boulder', 'pe_route', 'arc'], technique: ['technik'], tactics: ['technik', 'wk_sim'], pull: ['athletik'], core: ['athletik'] };
  Object.keys(B).forEach(k => {
    const t = B[k].types.slice(); const key = t[0];
    const rest = t.slice(1);
    const boosted = [];
    weak.forEach(w => (map[w] || []).forEach(ty => { const i = rest.indexOf(ty); if (i >= 0) { boosted.push(ty); rest.splice(i, 1); } }));
    B[k] = Object.assign({}, B[k], { key: k, types: [key].concat(boosted, rest) });
  });
  return B;
}

function blockSequence(p, perm, n) {
  const disc = p.mainDisc || 'boulder';
  const lead = disc === 'lead' || (disc === 'rock' && (p.disciplines || []).includes('lead'));
  let seq, keep;
  if (perm.st === 'aufbau' || perm.st === 'grundlagen') { seq = ['basis', 'kraft', 'power', 'pe', 'leistung']; keep = ['basis', 'kraft', 'pe', 'power', 'leistung']; }
  else if (p.goalType === 'comp') { seq = lead ? ['basis', 'kraft', 'pe', 'leistung'] : ['basis', 'kraft', 'power', 'pe', 'leistung']; keep = ['kraft', 'leistung', lead ? 'pe' : 'power', 'basis', 'pe']; }
  else if (lead) { seq = ['basis', 'kraft', 'aerob', 'pe', 'leistung']; keep = ['pe', 'kraft', 'leistung', 'basis', 'aerob']; }
  else if (p.goalType === 'general') { seq = ['basis', 'kraft', 'pe', 'power']; keep = ['basis', 'kraft', 'pe', 'power']; }
  else { seq = ['basis', 'kraft', 'power', 'leistung']; keep = ['kraft', 'power', 'leistung', 'basis']; }
  if (['0', '<1'].includes(p.structYears)) keep = ['basis'].concat(keep.filter(k => k !== 'basis'));
  if (n <= seq.length) {
    const chosen = keep.filter(k => seq.includes(k)).slice(0, n);
    return seq.filter(k => chosen.includes(k));
  }
  const out = seq.slice();
  const cyc = seq.filter(k => k !== 'basis');
  let i = 0; while (out.length < n) { out.splice(out.length - 1, 0, cyc[i % (cyc.length - 1)]); i++; }
  return out;
}

/* ---------- Plan erzeugen ---------- */
function generatePlan(p) {
  const perm = permsOf(p);
  const start = mondayOf(parseDate(p.startDate) || new Date());
  let N = +p.weeks || 8;
  if (p.goalDate) {
    const g = parseDate(p.goalDate);
    N = clamp(Math.ceil((g - start + DAY_MS) / (7 * DAY_MS)), 3, 24);
  }
  const L = (perm.youth || p.dailyLoad === 'hoch' || +p.age >= 50) ? 3 : 4;
  const taper = (p.goalDate && p.goalType !== 'general' && N >= 5) ? 1 : 0;
  const usable = N - taper;
  const nb = Math.max(1, Math.floor(usable / L));
  const rem = usable - nb * L;
  const keys = blockSequence(p, perm, nb);
  const defs = blockDefs(p, perm);
  const blocks = [];
  let w0 = 0;
  keys.forEach((k, i) => {
    let len = (usable < L) ? usable : L + (i === 0 ? rem : 0);
    blocks.push(Object.assign({}, defs[k], { key: k, start: w0, len }));
    w0 += len;
  });
  if (taper) {
    const last = blocks[blocks.length - 1];
    blocks.push({ key: 'taper', name: 'Tapering vor dem Höhepunkt', mix: 'Umfang −40 bis −60 %, Intensität halten, frisch werden', types: last.types, start: w0, len: 1 });
  }
  const weeks = [];
  blocks.forEach((b, bi) => {
    for (let i = 0; i < b.len; i++) {
      let kind = 'load', load;
      if (b.key === 'taper') { kind = 'taper'; load = 0.5; }
      else if (b.len >= 3 && i === b.len - 1) { kind = 'deload'; load = 0.6; }
      else load = Math.min(1.25, 1 + 0.1 * i);
      const nLoad = b.len >= 3 ? b.len - 1 : b.len;
      weeks.push({ idx: b.start + i, block: bi, pos: i, kind, load, label: kind === 'deload' ? 'Entlastungswoche' : kind === 'taper' ? 'Tapering' : 'Belastungswoche ' + (i + 1) + '/' + nLoad });
    }
  });
  const sessions = [];
  weeks.forEach(w => scheduleWeek(p, perm, w, blocks[w.block], blocks, sessions));
  return { v: 1, start: isoDate(start), weeks, blocks, sessions, created: new Date().toISOString() };
}

function circDist(a, b) { const d = Math.abs(a - b) % 7; return Math.min(d, 7 - d); }
function placeOk(type, day, perm) {
  const pl = day.place || 'halle';
  const tp = TYPES[type].place;
  if (pl === 'home') {
    if (type === 'finger_max') return perm.hb;
    return tp === 'both';
  }
  return true;
}

function scheduleWeek(p, perm, w, block, blocks, out) {
  const days = p.days;
  const restMin = perm.youth ? 2 : 1;
  const fixed = (p.fixed || []).filter(f => f.day !== '' && f.day != null);
  const fixedDays = new Set(fixed.map(f => +f.day));
  let total = clamp(+p.sessionsPerWeek || 3, 1, 7 - restMin);
  let remaining = Math.max(0, total - fixedDays.size);
  const hardDays = [];
  fixed.forEach((f, i) => {
    const s = { id: 'w' + w.idx + 'f' + i, week: w.idx, day: w.idx * 7 + (+f.day), type: 'fixed', prio: 0, dur: +f.dur || 90, fixed: { type: f.type, label: f.label || '', intensity: f.intensity || 'mittel' } };
    s.rpe = f.intensity === 'hart' ? 8 : f.intensity === 'leicht' ? 4 : 6;
    s.hard = f.intensity === 'hart' && FIXED_CLIMB.includes(f.type);
    if (s.hard) hardDays.push(+f.day);
    out.push(s);
  });
  let cand = [0, 1, 2, 3, 4, 5, 6].filter(d => days[d] && days[d].avail && +days[d].min >= 15 && !fixedDays.has(d));
  const occupied = [...fixedDays];
  const chosen = [];
  while (chosen.length < remaining && cand.length) {
    let best = null, bs = -1e9;
    cand.forEach(d => {
      const md = occupied.length ? Math.min(...occupied.map(o => circDist(o, d))) : 3;
      const sc = md * 10 + (+days[d].min) / 60 - d * 0.01;
      if (sc > bs) { bs = sc; best = d; }
    });
    chosen.push(best); occupied.push(best); cand = cand.filter(d => d !== best);
  }
  // Typen-Liste der Woche
  let types = block.types.slice();
  const isLastOfBlock = w.pos === block.len - 1;
  const lastBlock = blocks[blocks.length - 1] === block;
  if (w.kind === 'deload' && isLastOfBlock && !(lastBlock)) types = ['test'].concat(types);
  if (perm.st !== 'erwachsen' && perm.st !== 'anschluss') types = types.filter(t => t !== 'finger_max');
  if (!perm.hb && !perm.fingerIssue && perm.st === 'anschluss') types = types.map(t => t === 'finger_max' ? 'limit' : t);
  // Duplikate auflösen
  types = types.filter((t, i) => types.indexOf(t) === i);
  // Bei Entlastung/Taper max. 1 harter Fingerreiz zusätzlich zum Test
  const softFill = ['technik', 'arc', 'athletik', 'volumen', 'prehab_mob'];
  const assign = {};
  const free = chosen.slice();
  let hardCount = 0;
  const maxHard = (w.kind === 'deload' || w.kind === 'taper') ? 1 : (perm.youth ? 2 : 3);
  const queue = types.concat(softFill, softFill);
  for (const t of queue) {
    if (!free.length) break;
    const T = TYPES[t];
    const fits = free.filter(d => placeOk(t, days[d], perm) && +days[d].min >= Math.min(T.min, 45));
    if (!fits.length) continue;
    if (T.hard) {
      if (hardCount >= maxHard + (t === 'test' ? 1 : 0)) continue;
      let best = null, bs = -1e9;
      fits.forEach(d => {

        if (sc > bs) { bs = sc; best = d; }

    } else {

  list.forEach(s => out.push(s));
}

/* ---------- Anpassung: Feedback chronologisch nachspielen ---------- */

  const notes = [];

  function hardAt(day, exceptId) {

  }

  function reschedule(s) {
    const T = TYPES[s.type];

    const tryRange = (from, to, allowFree) => {

    if (x.pain === 'rot') { redUntil = s.day + 7; notes.push({ day: s.day, kind: 'warn', text: 'Schmerz-Ampel Rot nach der zusätzlichen Einheit: 7 Tage keine harte Fingerbelastung, medizinische Abklärung.' }); }
    else if (x.pain === 'gelb') { yellowUntil = Math.max(yellowUntil, s.day + 7); notes.push({ day: s.day, kind: 'warn', text: 'Schmerz-Ampel Gelb: Finger-, Power- und Kraftausdauer-Einheiten der nächsten 7 Tage mit −20 % Umfang und offenen Griffen.' }); }

      if (cand.length) {

        notes.push({ day: s.day, kind: 'drop', text: '„' + TYPES[o.type].name + '“ (' + fmtDay(plan, o.day) + ') entfällt, damit ' + (restMin === 2 ? 'mindestens zwei Ruhetage' : 'mindestens ein Ruhetag') + ' in der Woche bleiben.' });
      } else notes.push({ day: s.day, kind: 'warn', text: 'Durch die zusätzliche Einheit bleibt in dieser Woche kein ' + (restMin === 2 ? 'zweiter ' : '') + 'Ruhetag mehr – auf Erholung achten.' });

        const home = env === 'home' || env === 'hangboard';

        ss.push(r);

        if (nt !== orig) {

            const c = Object.assign({}, s, { id: s.id + 'v', type: orig, env: null, altFrom: null, home: false, noMove: false, adj: [], factor: 1, dur: plan.sessions.find(o => o.id === s.id) ? plan.sessions.find(o => o.id === s.id).dur : s.dur });
            const slot = reschedule(c);
            if (slot) {

              c.day = slot.day; c.week = Math.floor(slot.day / 7); c.movedFrom = s.day; c.noMove = true; ss.push(c);
              notes.push({ day: s.day, kind: 'move', text: 'Alternative „' + ALT_LABEL[alt] + '“ am ' + fmtDay(plan, s.day) + ': „' + TYPES[nt].name + '“ statt „' + TYPES[orig].name + '“. Die eigentliche Einheit wird auf ' + fmtDay(plan, slot.day) + ' verlegt' + (slot.replace ? ' und ersetzt dort „' + TYPES[slot.replace.type].name + '“' : '') + '.' });
            } else notes.push({ day: s.day, kind: 'drop', text: 'Alternative „' + ALT_LABEL[alt] + '“ am ' + fmtDay(plan, s.day) + ': „' + TYPES[nt].name + '“ statt „' + TYPES[orig].name + '“. Für „' + TYPES[orig].name + '“ gibt es diese Woche keinen passenden Ersatztermin – der Schwerpunkt läuft in den nächsten Einheiten weiter.' });
          } else notes.push({ day: s.day, kind: 'info', text: 'Alternative „' + ALT_LABEL[alt] + '“ am ' + fmtDay(plan, s.day) + ': „' + TYPES[nt].name + '“ statt „' + TYPES[orig].name + '“ – gleicher Trainingsschwerpunkt, der Plan läuft regulär weiter.' });
          if (TYPES[nt].hard && !TYPES[orig].hard) defuseNear(s, 'der harten Alternative');
        } else notes.push({ day: s.day, kind: 'info', text: 'Alternative „' + ALT_LABEL[alt] + '“ am ' + fmtDay(plan, s.day) + ': „' + TYPES[nt].name + '“ angepasst an die Umgebung – der Plan läuft regulär weiter.' });
      }
    }
    const T = TYPES[s.type];

    // Schmerz-Ampel auf künftige Einheiten anwenden

        const n = Object.assign({}, s, { id: s.id + 'n', day: slot.day, week: Math.floor(slot.day / 7), movedFrom: s.day, noMove: true, altRest: false, adj: [], factor: 1 });
        ss.push(n);
        notes.push({ day: s.day, kind: 'move', text: '„' + T.name + '“ (' + fmtDay(plan, s.day) + ') ' + (L.rest ? 'durch Ruhetag ersetzt' : 'ausgefallen') + ' → verschoben auf ' + fmtDay(plan, slot.day) + (slot.replace ? ', ersetzt dort „' + TYPES[slot.replace.type].name + '“' : '') + '. 48-h-Abstand harter Fingerreize und Ruhetage bleiben gewahrt.' });
      } else {
        notes.push({ day: s.day, kind: 'drop', text: '„' + T.name + '“ (' + fmtDay(plan, s.day) + ') ' + (L.rest ? 'durch Ruhetag ersetzt' : 'ausgefallen') + ' – ' + (s.prio <= 2 ? 'kein passender Ersatztermin ohne Verletzung der Ruhe- bzw. 48-h-Regel' : 'Ergänzungseinheit, wird nicht nachgeholt (keine Last „hineinstopfen“)') + '. Der Plan läuft regulär weiter.' });
      }
      continue;

    const rpe = L.rpe != null ? +L.rpe : null;
    if (L.pain === 'rot') { redUntil = s.day + 7; notes.push({ day: s.day, kind: 'warn', text: 'Schmerz-Ampel Rot nach „' + (s.type === 'fixed' ? FIXED_TYPES[s.fixed.type] : T.name) + '“: 7 Tage keine harte Fingerbelastung, medizinische Abklärung.' }); }
    else if (L.pain === 'gelb') { yellowUntil = Math.max(yellowUntil, s.day + 7); notes.push({ day: s.day, kind: 'warn', text: 'Schmerz-Ampel Gelb: Finger-, Power- und Kraftausdauer-Einheiten der nächsten 7 Tage mit −20 % Umfang und offenen Griffen.' }); }
    if (rpe == null || s.type === 'regen') continue;
    const diff = rpe - target;
    if (s.type !== 'fixed' && CATS.includes(cat)) {
      const sameDir = Math.sign(diff) !== 0 && Math.sign(diff) === Math.sign(trend[cat]);
      let step = 0;
      if (diff <= -2) step = sameDir ? 0.10 : 0.07;
      else if (diff === -1) step = 0.04;
      else if (diff === 1) step = sameDir ? -0.04 : 0;
      else if (diff >= 2) step = sameDir ? -0.12 : -0.08;
      if (rpe >= 10 && target < 10) step = Math.min(step, -0.12);
      trend[cat] = diff;
      if (step !== 0) {
        f[cat] = cap(f[cat] * (1 + step));
        reason[cat] = 'letzte Einheit „' + T.name + '“ (' + fmtDay(plan, s.day) + ') mit RPE ' + rpe + ' statt Ziel ' + target;
        notes.push({ day: s.day, kind: step > 0 ? 'up' : 'down', text: '„' + T.name + '“ ' + (step > 0 ? 'zu leicht' : 'zu hart') + ' (RPE ' + rpe + ', Ziel ' + target + ') → folgende ' + CAT_LABEL[cat] + '-Einheiten ' + (step > 0 ? '+' : '−') + Math.round(Math.abs(step) * 100) + ' % (' + (rpe >= 10 && target < 10 ? 'Ausbelastung erreicht' : sameDir ? 'wiederholte Abweichung' : 'einzelne Abweichung, vorsichtiger Schritt') + ').' });
      } else if (diff === 0) { reason[cat] = reason[cat]; }
    }

    if (diff >= 2) consecutiveHigh++; else consecutiveHigh = 0;
    if (consecutiveHigh >= 2) {
      global = cap(global * 0.9); consecutiveHigh = 0;
      globalReason = 'Zwei Einheiten in Folge deutlich härter als geplant – Gesamtumfang −10 % (Ermüdung)';
      notes.push({ day: s.day, kind: 'warn', text: globalReason + '. Schlaf, Alltag und Erholung prüfen (Handbuch 10.4).' });
    } else if (Math.abs(diff) <= 1 && global < 1) {
      global = Math.min(1, global + 0.03);
    }
  }
  return { sessions: ss, notes, factors: f, global };
}

/* ---------- Belastung (Session-RPE × Minuten) ---------- */
function weekLoads(plan, rs, log) {
  return plan.weeks.map(w => {
    let planned = 0, actual = 0;
    rs.sessions.filter(s => s.week === w.idx && !s.dropped).forEach(s => {
      if (s.type === 'extra') { actual += s.rpe * s.dur; return; }
      const rpe = s.type === 'fixed' ? s.rpe : TYPES[s.type].rpe;
      const dur = effDur(s, plan);
      const L = log[s.id];
      if (!(L && L.status === 'missed') && !s.altRest && !s.cancelled) planned += rpe * dur * (s.type === 'fixed' ? 1 : s.factor);
      if (L && L.status === 'done') actual += (L.rpe != null ? +L.rpe : rpe) * (L.dur ? +L.dur : dur);
    });
    return { planned: Math.round(planned), actual: Math.round(actual) };
  });
}
function effDur(s, plan) { return s.dur; }


/* ================= Übungsbibliothek – Beschreibungen nach Grundlagenhandbuch Teil 11–13 ================= */
const EX = {

  K1: { n: 'Kontrollierte Schulterkreise', d: 'Aufrecht stehen, Rumpf fest. Einen Arm gestreckt in größtmöglichem Kreis langsam vor- und rückwärts führen. Becken und Oberkörper bewegen sich nicht mit – keine Ausweichbewegung. Schwerer im Vierfüßlerstand.' },
  K2: { n: 'Katze-Kuh mit Faden einfädeln', d: 'Vierfüßlerstand, Hände unter den Schultern, Knie unter der Hüfte. Wirbelsäule langsam rund machen und wieder ins Hohlkreuz strecken. Danach einen Arm unter dem Körper durchfädeln, kurz halten und weit nach oben aufdrehen – Blick folgt der Hand.' },
  K3: { n: 'Frosch-Halteposition', d: 'Tiefe Hocke, Knie zeigen nach außen. Ellbogen drücken die Knie aktiv auseinander, Rücken lang, Fersen möglichst am Boden. Ruhig atmen.' },
  K4: { n: '90/90-Hüftrotation', d: 'Sitzen, beide Knie im 90°-Winkel, ein Bein vorn, eins seitlich. Knie ohne Hilfe der Hände von einer Seite zur anderen drehen, Oberkörper aufrecht. Fortgeschritten: ohne Handstütze und mit Aufrichten in den Kniestand.' },
  K5: { n: 'Handgelenk- und Fingermobilisation', d: 'Kniestand, Hände in vier Ausrichtungen aufsetzen (Finger nach vorn, außen, innen, hinten) und sanft belasten. Danach Finger spreizen, beugen, Fäuste öffnen und schließen. Vor jedem Fingertraining.' },
  K24: { n: 'Liegestütz Plus', d: 'Hohe Liegestützposition, Arme gestreckt, Rumpf fest. Ohne die Ellbogen zu beugen nur die Schulterblätter zusammen sinken lassen und dann weit auseinanderschieben (Rücken wird oben rund). Aktiviert den vorderen Sägemuskel.' },
  K30: { n: 'Hollow Body', d: 'Rückenlage, unterer Rücken fest am Boden. Arme und Beine gestreckt knapp über dem Boden halten, Bauchnabel nach innen. Einfacher mit gebeugten Knien, schwerer mit leichtem Schaukeln.' },
  L20: { n: 'Außenrotation am Körper (Band)', d: 'Ellbogen 90° gebeugt am Körper, Handtuch zwischen Ellbogen und Rumpf einklemmen. Unterarm gegen das Band langsam nach außen drehen, kontrolliert zurück. Schulter bleibt tief.' },
  L22: { n: 'Band Pull-apart', d: 'Arme gestreckt vor der Brust, Band schulterbreit greifen. Band durch Zusammenführen der Schulterblätter auseinanderziehen, bis es die Brust berührt. Langsam zurück, Rippen unten lassen.' },
  einklettern: { n: 'Einklettern', d: 'Leichte Boulder bzw. Routen in steigender Schwierigkeit. Alle Grifftypen nacheinander: Henkel, Leisten offen, halbaufgestellt, Sloper, Zangen. Am Ende 2–3 harte Einzelzüge. Erst steigern, wenn sich die Finger warm anfühlen.' },
  einklettern_kind: { n: 'Spielerisch einklettern', d: 'Leichte Boulder im Wechsel, Fangspiele an der Wand, Kopier-Spiel (einer macht vor, alle klettern nach). Kein Hangboard.' },
  fingerakt: { n: 'Fingeraktivierung am Hangboard', d: 'Steigernd belasten: große Leiste mit 40–60 % (Füße am Boden oder Stuhl), dann mittlere Leiste mit 70–80 %, zuletzt Zielgriff mit ca. 90 %. Offen bzw. halbaufgestellt, nie ruckartig einhängen.' },
  // Finger
  maxhang: { n: 'Max Hangs mit Zusatzlast', d: 'An 18–20 mm Leiste halbaufgestellt (oder offen) einhängen, Schultern aktiv, Arme gestreckt, Rumpf ruhig. 10 s halten mit der vorgegebenen Reserve – du könntest also noch einige Sekunden länger halten. Zusatzlast am Gurt. Kontrolliert lösen, nicht abspringen. Abbruch bei Schmerz oder wenn die Griffposition sich öffnet.' },
  entlastet: { n: 'Entlastetes Hängen', d: 'Hangboard, Füße auf Boden oder Stuhl. Die Fingerlast über die Beine dosieren – nur so viel Gewicht in die Finger, dass die Position mühelos bleibt. Offen oder halbaufgestellt, nie vollaufgestellt.' },
  repeaters: { n: 'Repeaters', d: '7 s hängen, 3 s lösen, 6 Wiederholungen ergeben einen Satz. Leiste so wählen, dass der letzte Hang des Satzes gerade noch sauber gelingt. Griffposition über den ganzen Satz halten.' },
  nohang: { n: 'No-Hang / Lift-off', d: 'Leistenblock (z. B. 20 mm) mit Gewichtsscheibe oder Kettlebell am Boden. Im Stand einarmig greifen und das Gewicht 5–10 s knapp anheben und halten. Last sehr genau dosierbar – sehnenschonend, auch in der Reha.' },
  minleiste: { n: 'Minimale Leiste', d: 'An der kleinsten Leiste, die du gerade noch 10–12 s halten kannst, mit Körpergewicht hängen. Halbaufgestellt, Schultern aktiv.' },
  zange: { n: 'Zange und Sloper hängen', d: 'Zangen- oder Slopergriffe am Hangboard halten, Füße ggf. zur Entlastung aufgestellt. Ringbandschonend, großer Übertrag zum Bouldern.' },
  limit: { n: 'Limit-Bouldern', d: 'Kurze, maximal schwere Boulder mit 3–5 Zügen. Jeder Versuch mit voller Konzentration und Spannung, danach volle Pause. Bewegungsqualität vor Durchstieg – abbrechen, sobald Züge unsauber werden oder Füße rutschen.' },
  projektboulder_kind: { n: 'Projektbouldern an offenen Griffen', d: 'Schwierige Boulder an Henkeln, Slopern und offenen Leisten. Mehrere Versuche, zwischendurch Lösungen besprechen und ausprobieren. Kein vollaufgestellter Griff.' },
  volumen_locker: { n: 'Lockeres Volumen', d: 'Einige Boulder 3–4 Grade unter dem Maximum, ruhig und sauber klettern. Fokus auf leise Füße und gestreckte Arme.' },
  // Power
  dyno: { n: 'Dynamo- und Koordinationsboulder', d: 'Boulder mit Sprüngen, Deadpoints, Laufstarts und Koordinationszügen. Jeder Versuch mit maximaler Absicht und Schwung aus Beinen und Hüfte. Volle Pause zwischen Versuchen. Abbrechen, sobald die Bewegung langsamer wird.' },
  dyno_kind: { n: 'Koordinationssprünge spielerisch', d: 'Koordinationssprünge, Laufstarts und Deadpoints an großen Griffen, gern als Spiel oder Wettbewerb. Weich landen, sicherer Fallraum.' },
  campus: { n: 'Campusboard – Leitern', d: 'Ohne Füße an großen Sprossen. Grundfolge 1-3-5 bzw. Leitern im Wechsel, explosiv und präzise greifen. Nur ausgeruht, kleiner Umfang, Qualität vor Quantität. Nur für erfahrene, ausgewachsene Athlet:innen.' },
  K16: { n: 'Explosiver Klimmzug', d: 'Aus aktivem Hängen maximal schnell ziehen, Brust Richtung Stange. Fortgeschrittene lassen oben kurz los und fangen wieder. Kontrolliert ablassen, volle Pause.' },
  K47: { n: 'Counter-Movement-Jump', d: 'Aus dem Stand kurz ausholen (in die Knie gehen, Arme nach hinten) und maximal hoch springen. Weich und leise landen, Knie über den Zehen.' },
  K48: { n: 'Box Jump / einbeinige Sprünge', d: 'Explosiv auf einen Kasten springen, aufrecht landen, absteigen (nicht abspringen). Fortgeschritten: einbeinig vorwärts oder seitwärts. Für Laufstarts und Koordinationssprünge.' },
  L30: { n: 'Überkopfwurf gegen die Wand', d: 'Medizinball (2–4 kg) über den Kopf führen und mit dem ganzen Körper explosiv gegen die Wand werfen – Kraft kommt aus Beinen und Rumpf. Nicht gegen Klettergriffe werfen.' },
  L33: { n: 'Ball-Slam', d: 'Slamball über den Kopf heben und mit voller Kraft auf den Boden schlagen, dabei in die Knie gehen. Ganzkörper-Explosivität, Latissimus.' },
  speedlauf: { n: 'Speed-Läufe', d: 'Starts und Sektionen der 15-m-Normroute einschleifen. Jeder Lauf mit voller Geschwindigkeit, automatisierte Bewegungsfolge, volle Pause dazwischen.' },
  // Kraftausdauer & Ausdauer
  vierxvier: { n: '4×4', d: 'Vier Boulder unterhalb des Maximums direkt hintereinander klettern (kurze Pause zwischen den Bouldern), das ist eine Runde. Vier Runden. Ziel: Laktattoleranz und Crux-Ausdauer – am Ende deutlicher Pump, aber saubere Technik.' },
  zirkel_kind: { n: 'Boulder-Zirkel', d: 'Vier leichte Boulder hintereinander klettern, dann Pause. Als Spiel mit Partner: abwechselnd klettern, Zeit stoppen, Rekorde brechen.' },
  routenint: { n: 'Routenintervalle', d: 'Route nahe am Maximum klettern, danach lange Pause. Ruhepunkte aktiv nutzen, aus gestrecktem Arm clippen, Tempo bewusst wählen. Alternativ Linkups oder Doppelrunden.' },
  circuit_lang: { n: 'Lange Boulder-Circuits', d: 'Circuits mit 25–40 Zügen nahe der Leistungsgrenze, z. B. an Systemwand oder als Linkup mehrerer Boulder.' },
  langint: { n: 'Lange Intervalle', d: 'Klettern im Dauer-Wechsel – Route rauf und runter oder Traverse – mit deutlichem, aber kontrolliertem Pump. Pause gleich lang wie die Belastung. Ziel: kritische Kraft anheben.' },
  arc: { n: 'ARC – Dauerklettern', d: 'Ohne Unterbrechung an der Wand bleiben, leichter Pump, Gespräch möglich. Leichte Griffe, viele Tritte, Technikfokus: leise Füße, gestreckte Arme, ruhige Atmung. Wird der Pump stark, leichtere Griffe wählen.' },
  sturz: { n: 'Sturztraining', d: 'Mit kompetenter, dynamisch sichernder Person und überhängender Wand ohne Absatz. Stufenweise: ins Seil setzen → Knie auf Höhe der Exe → Hüfte auf Höhe → Fuß auf Höhe → 1–2 Züge darüber. Partnercheck vor jedem Sturz. Angst ist normal – Ziel ist Handlungsfähigkeit.' },
  // Technik & Taktik
  tech_silent: { n: 'Silent Feet', d: 'Jeden Tritt so präzise und leise setzen, dass kein Geräusch entsteht. Augen bleiben am Tritt, bis der Fuß belastet ist.' },
  tech_hover: { n: 'Hover Hands', d: 'Vor jedem Griff die Hand 2 s über dem Griff schweben lassen. Gelingt das nicht, war die Position instabil – Füße und Hüfte anpassen.' },
  tech_eindrehen: { n: 'Eindrehen & Flagging', d: 'Boulder bewusst eingedreht (Drop Knee, Hüfte an die Wand) bzw. mit Flagging innen und außen klettern. Ziel: „Barn Door“ ohne Kraftaufwand verhindern.' },
  tech_elim: { n: 'Eliminates', d: 'Bestimmte Griffe oder Tritte verbieten, um neue Lösungen zu erzwingen. Mit Partner Regeln wechseln.' },
  tech_down: { n: 'Downclimbing', d: 'Boulder bzw. Route nach dem Hochklettern wieder abklettern. Schult Fußpräzision und Bewegungsverständnis.' },
  tech_tempo: { n: 'Tempo-Variation', d: 'Gleichen Boulder langsam, normal und schnell klettern. Spüren, welche Züge Schwung brauchen und welche Kontrolle.' },
  tech_arme: { n: 'Gestreckte Arme', d: 'Ganze Boulder oder Routen mit möglichst gestreckten Armen klettern – Last auf Skelett und Sehnen statt Bizeps. Hüfte bewegt sich, Arme halten.' },
  tech_halt: { n: 'Pause und Halt', d: 'Partner ruft „Stopp“ – in jeder Position 3 s ruhig halten. Zwingt zu stabilen, ökonomischen Positionen.' },
  tech_stil: { n: 'Stilwechsel', d: 'In einer Einheit Platte, Leisten, Sloper, Kompression und Koordination nacheinander. Bewusst die Körperposition an den Stil anpassen.' },
  tech_erfinden: { n: 'Boulder-Erfinden', d: 'Gegenseitig Boulder zu einem Thema erfinden (z. B. Untergriffe, Heelhooks). Wer baut, muss die Lösung erklären können.' },
  tech_tap: { n: 'Fuß-Tap', d: 'Jeden Tritt zweimal antippen, erst dann belasten. Verbessert Zielgenauigkeit und Ruhe im Fuß.' },
  tech_hooks: { n: 'Hohe Tritte & Hooks', d: 'Boulder mit hohen Tritten, Heel- und Toe-Hooks. Hüfte über den hohen Fuß schieben, Hooks aktiv ziehen.' },
  tech_gegendruck: { n: 'Gegendruck, Piaz & Stemmen', d: 'Seitgriffe mit Gegenzug, Piazschuppen und Stemmverschneidungen. Kraftvektor bewusst gegen die Griffrichtung aufbauen.' },
  tech_dynamik: { n: 'Deadpoint & Paddeln', d: 'Züge am Totpunkt greifen, wenn der Körper kurz „schwerelos“ ist. Paddeln: mehrere Griffe schnell hintereinander. Timing vor Kraft.' },
  onsight: { n: 'Onsight-Boulder', d: 'Unbekannte Boulder: erst 1 min beobachten (Griffe, Tritte, Handfolge, Körperpositionen), dann mit begrenzten Versuchen klettern. Nach jedem Versuch Plan mit Realität vergleichen.' },
  routenlesen: { n: 'Routenlesen', d: 'Route in Abschnitte gliedern (Start, Crux, Ruhepunkt, Ausstieg), Handfolge festlegen, Clips und Ruhepunkte planen, mit geschlossenen Augen im Tempo „durchklettern“. Danach klettern und vergleichen.' },
  onsight_route: { n: 'Onsight-Routen mit verkürzter Besichtigung', d: 'Unbekannte Routen mit begrenzter Besichtigungszeit (6 → 3 → 1 min). Ein Versuch, im Zweifel klettern statt zögern.' },
  volumen: { n: 'Klettervolumen', d: 'Viele Boulder bzw. Routen 2–4 Grade unter dem Maximum, alle Wandneigungen und Grifftypen. Stile bewusst wechseln, saubere Ausführung.' },
  spiele_kind: { n: 'Kletterspiele', d: 'Boulder-Erfinden, Kopier-Spiel, Fallen und Abspringen üben. Bewegungsvielfalt und Freude stehen im Vordergrund.' },
  wkboulder: { n: 'Wettkampf-Boulder', d: 'Unbekannte Boulder mit fester Zeit. Erster Versuch mit voller Konzentration (Flash zählt), Zonen-Strategie, Versuche zählen. Nach Fehlversuch: atmen, analysieren, eine Änderung, neu fokussieren.' },
  wkaufw: { n: 'Wettkampf-Aufwärmen', d: 'Aufwärmen wie im Wettkampf – Puls, Finger, mentale Routine – und eine Isolationszeit simulieren.' },
  wkroute: { n: 'Onsight-Route im Wettkampfmodus', d: 'Besichtigung strukturiert nutzen (Abschnitte, Clips, Ruhepunkte), dann ein Versuch. Am Ende „Fightmodus“.' },
  projekt: { n: 'Projektversuche', d: 'Projekt in Abschnitte zerlegen, Schlüsselstellen isolieren, Linkups aufbauen, Beta notieren und visualisieren. Dann ernsthafte Versuche. In den Pausen: leichte Unterarmbewegung statt völliger Ruhe.' },
  // Athletik
  K8: { n: 'Klimmzug', d: 'Aus aktivem Hängen (Schulterblätter unten) ziehen, bis das Kinn über der Stange ist, kontrolliert ablassen. Bei Bedarf mit Gummiband-Unterstützung.' },
  K9: { n: 'Negativ-Klimmzug', d: 'Oben starten (Sprung oder Kasten), 4–6 s langsam und gleichmäßig absenken. Vorstufe zum freien Klimmzug.' },
  K12: { n: 'Blockieren (Lock-off)', d: 'Hochziehen und in drei Winkeln je 5 s halten: oben, 90°, 120°. Schultern aktiv, Rumpf ruhig.' },
  K13: { n: 'Frenchies', d: 'Klimmzug, oben 5 s halten, ab; Klimmzug, bei 90° 5 s halten, ab; Klimmzug, bei 120° 5 s halten, ab – das ist ein Zyklus. Klassische Blockierausdauer.' },
  K20: { n: 'Rudern am Ring/Tisch', d: 'Körper schräg unter Stange oder Ringen, Füße am Boden, Körper gerade. Brust zur Stange ziehen, Schulterblätter zuerst. Schwerer: flacher stellen, Füße erhöht.' },
  K21: { n: 'Liegestütz', d: 'Hände unter den Schultern, Ellbogen ca. 45° vom Körper, Brust zum Boden, Rumpf fest. Einfacher mit Händen erhöht, schwerer mit Füßen hoch oder an Ringen.' },
  K26: { n: 'Bärengang', d: 'Vierfüßler mit Knien knapp über dem Boden vorwärts und rückwärts krabbeln, Rücken flach. Variante rücklings im Krebsgang.' },
  K28: { n: 'Unterarmstütz', d: 'Unterarme unter den Schultern, Körper gerade von Kopf bis Fuß, Bauch und Gesäß fest. Nicht ins Hohlkreuz sinken.' },
  K29: { n: 'Seitstütz', d: 'Seitlich auf einem Unterarm, Hüfte hoch, Körper eine Linie. Variante Copenhagen: oberes Bein auf einer Bank (Adduktoren).' },
  K34: { n: 'Hängendes Knieheben', d: 'Aktiv an der Stange hängen, Knie ohne Schwung zur Brust ziehen, langsam ablassen.' },
  K35: { n: 'Zehen zur Stange', d: 'Aus dem aktiven Hängen die gestreckten Beine bis an die Stange führen, kontrolliert ab – ohne Schwung.' },
  K38: { n: 'Front-Lever-Progression', d: 'Aus dem Hängen den Körper waagerecht halten. Stufen: Tuck (Knie an der Brust) → Advanced Tuck → einbeinig → Straddle → voll. Schulterblätter nach unten ziehen, Arme gestreckt.' },
  K40: { n: 'Füße halten im Überhang', d: 'Im 30–45°-Überhang an vier Griffen, Füße auf kleinen Tritten. Einen Fuß abnehmen und präzise neu setzen, ohne dass der andere rutscht. Kletterspezifische Rumpfspannung.' },
  K41: { n: 'Kniebeuge', d: 'Schulterbreiter Stand, Hüfte nach hinten, Knie über den Zehen, so tief wie sauber möglich. Rücken neutral.' },
  K42: { n: 'Bulgarische Kniebeuge', d: 'Hinterer Fuß auf einer Bank, vorderes Knie beugen, bis der hintere Oberschenkel fast senkrecht ist. Oberkörper aufrecht. Schwerer mit Kurzhanteln.' },
  K44: { n: 'Hüftheben einbeinig', d: 'Rückenlage, ein Fuß am Boden, anderes Bein gestreckt. Becken anheben, bis Schulter-Hüfte-Knie eine Linie bilden, Hüfte bleibt gerade.' },
  K50: { n: 'Hohe Tritte aktiv', d: 'An Wand oder Sprossenwand den Fuß ohne Schwung so hoch wie möglich setzen und 2 s halten. Aktive Hüftbeugung.' },
  K9b: { n: 'Negativ-Klimmzug', d: 'Oben starten, 4–6 s langsam absenken.' },
  L1: { n: 'Kettlebell Swing', d: 'Hüftbreit, Glocke zwischen den Beinen nach hinten schwingen und aus der Hüfte explosiv nach vorn bis Brusthöhe treiben. Rücken neutral, Arme locker – die Hüfte arbeitet.' },
  L3: { n: 'Turkish Get-up', d: 'Aus der Rückenlage mit Glocke über dem Kopf in den Stand und zurück. Der Arm bleibt senkrecht, Blick zur Glocke. Langsam, Schritt für Schritt.' },
  L8: { n: 'Farmer’s Carry', d: 'Eine oder zwei Glocken tragen, aufrecht gehen, Rumpf nicht zur Seite neigen. Griffausdauer und seitliche Rumpfkraft.' },
  L13: { n: 'Klimmzug mit Zusatzlast', d: 'Gewichtsscheibe oder Kettlebell am Gurt, Ausführung wie beim Klimmzug. Last so, dass 3–5 saubere Wiederholungen gelingen.' },
  L27: { n: 'Pallof Press', d: 'Band seitlich auf Brusthöhe befestigt. Hände vor der Brust, Arme nach vorn strecken und 2 s halten – die Rotation verhindern. Becken und Schultern bleiben parallel.' },
  // Prehab & Beweglichkeit
  L15: { n: 'Exzentrische Handgelenkstreckung', d: 'Unterarm auf der Bank, Handrücken oben. Hantel mit Hilfe der anderen Hand nach oben bringen, dann langsam über 4 s absenken. Alternative mit Flexbar. Prävention beim „Kletterellbogen“.' },
  L23: { n: 'Face Pull', d: 'Band auf Kopfhöhe. Zum Gesicht ziehen, Ellbogen hoch, am Ende die Unterarme nach außen drehen. Außenrotation und Schulterblattkontrolle.' },
  L24: { n: 'Y-Raise', d: 'Band unter den Füßen oder tief befestigt. Arme gestreckt in Y-Form über den Kopf heben, Daumen nach oben, Schultern tief.' },
  L28: { n: 'Fingerstrecker-Band', d: 'Gummiband um alle Finger und den Daumen. Hand gegen den Widerstand öffnen, langsam schließen. Ausgleich zu den Fingerbeugern.' },
  K57: { n: 'Frosch an der Wand', d: 'Gesicht zur Wand, Füße weit auseinander, Knie gebeugt. Hüfte aktiv an die Wand schieben. Hüftabduktion für Platte und Senkrechte.' },
  K58: { n: 'Aktiver Seitspagat', d: 'Im Stand ein Bein seitlich ohne Hilfe so hoch wie möglich heben und 3 s halten. Oberkörper aufrecht.' },
  K59: { n: 'Tiefer Hocksitz', d: 'Fersen am Boden, Oberkörper aufrecht, Ellbogen drücken die Knie nach außen. Ruhig atmen.' },
  K60: { n: 'Hüftbeuger-Dehnung', d: 'Kniestand, Becken nach vorn schieben, Gesäß anspannen, Arm der hinteren Seite über den Kopf strecken.' },

  K62: { n: 'Schulterflexion an der Wand', d: 'Kniestand vor Bank oder Wand, Unterarme aufgelegt, Brust Richtung Boden sinken lassen. Latissimus-Dehnung, wichtig nach Zugtraining.' },
  unterarm_dehn: { n: 'Unterarmstrecker dehnen', d: 'Arm gestreckt, Handrücken nach oben, mit der anderen Hand die Finger sanft Richtung Körper ziehen. Nicht ins Ziehen hineinwippen.' },
  auslockern: { n: 'Auslockern', d: 'Lockeres Klettern an großen Griffen oder Ausschütteln, kurze Reflexion: Was lief gut? Was ändere ich nächstes Mal?' },
  // Tests
  t_maxhang: { n: 'Test: Max Hang 20 mm', d: 'Halbaufgestellt, 7–10 s, Zusatzlast schrittweise bis zum Maximum steigern. Kennwert: (Körpergewicht + Zusatzlast) / Körpergewicht in %.' },

/* ---------- Zeitvorgaben für den Timer ----------
   Stage: { label, sets, reps, work (s | null = manuell), off (s zwischen Wdh.), rest (s zwischen Sätzen), sides, seq:[{label,work}], stations:[...] } */
const TM = {
  hold: (sets, work, rest, o) => ({ stages: [Object.assign({ sets, work, rest }, o || {})] }),
  reps: (sets, rest, o) => ({ stages: [Object.assign({ sets, work: null, rest }, o || {})] }),
  dur: (min, label) => ({ stages: [{ sets: 1, work: Math.round(min * 60), rest: 0, label: label || 'Belastung' }] }),
  rep: (sets, reps, on, off, rest) => ({ stages: [{ sets, reps, work: on, off, rest }] }),
  circuit: (rounds, work, off, rest, stations) => ({ stages: [{ sets: rounds, stations, work, off, rest }] }),
  multi: (...stages) => ({ stages })
};

function timerPhases(spec, name) {
  const ph = [{ kind: 'prep', label: 'Bereit machen', sec: 10 }];
  spec.stages.forEach((st, si) => {
    const sets = st.sets || 1;

async function initCaps() {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user, dl, sample] = await Promise.all([window.claude.use('db'), window.claude.use('user'), window.claude.use('downloads'), window.claude.use('sample')]);

function withTimeout(p, ms) { return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code: 'timeout' }), ms))]); }

async function saveCurrent() {
  const a = S.athletes[S.cur]; if (!a) return;
  S.saving = true; renderTop();

  const okLocal = lsWrite();
  let okCloud = false;
  if (caps.db && caps.uid) {
    try {
      const json = JSON.stringify(a);
      if (json.length > 240000) throw { code: 'too_big' };
      await withTimeout(caps.db.collection('data/users/' + caps.uid + '/athletes').doc(a.id).set({ json, name: a.profile.name || '', updated: a.updated }), 10000);
      okCloud = true;
    } catch (e) { okCloud = false; }
  }
  S.saving = false;
  if (okCloud || okLocal) { S.dirty = false; S.savedAt = new Date(); toast(okCloud ? 'Gespeichert – in deinem Claude-Konto, auf allen Geräten verfügbar.' : 'Gespeichert – in diesem Browser.'); }

  renderTop();
}

  let h = '<section class="opener">' + shardsSVG() + '<div class="eyebrow">KLETTERHALLENVERBAND KLEVER E.V.</div><h1>Trainingsplan-Generator Leistungsklettern</h1><p>Individuelle, dynamische Trainingspläne auf Basis des Grundlagenhandbuchs „Leistungsorientiertes Klettern & Bouldern“. Ein ausführliches Profil anlegen, Plan erstellen, Einheiten abhaken – der Plan passt sich an.</p><img class="wlogo" src="' + LOGO_W + '" alt=""></section>';
  h += '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px"><button class="btn" data-a="new">Neues Profil anlegen</button><label class="btn ghost" style="cursor:pointer">Plan-Datei importieren<input type="file" accept=".json,application/json" data-a="import" class="sr"></label></div>';
  h += '<h2 class="sec"><span class="n">1</span>Gespeicherte Profile</h2>';
  if (!list.length) h += '<div class="empty">Noch keine Profile gespeichert. Leg das erste Profil an – das Formular dauert etwa fünf Minuten.</div>';
  else {
    h += '<div class="athletes">';
    list.forEach(a => {
      const p = a.profile; const plan = a.plan;
      let prog = 0, info = 'Noch kein Plan';
      if (plan) { const tot = plan.sessions.length; const lg = Object.keys(a.log || {}).length; prog = tot ? Math.round(100 * lg / tot) : 0; info = plan.weeks.length + ' Wochen ab ' + fmtDate(parseDate(plan.start)) + ' · ' + lg + ' von ' + tot + ' Einheiten dokumentiert'; }
      h += '<article class="acard"><h3>' + esc(p.name || 'Ohne Namen') + '</h3><div class="m">' + esc(p.age) + ' Jahre · ' + STAGE_LABEL[stageOf(p.age)] + ' · ' + LEVEL_LABEL[levelOf(p)] + '</div><div class="m">' + esc(info) + '</div><div class="bar" aria-label="Fortschritt ' + prog + ' %"><i style="width:' + prog + '%"></i></div><div class="row"><button class="btn sm" data-a="open" data-id="' + a.id + '">Plan öffnen</button><button class="btn ghost sm" data-a="edit" data-id="' + a.id + '">Profil bearbeiten</button></div></article>';
    });
    h += '</div>';
  }
  h += '<div class="callout" style="margin-top:26px"><div class="lbl">FÜR DIE HALLE</div><p>Alle Zahlenangaben sind Richtwerte und an Alter, Trainingsalter und Belastbarkeit anzupassen. Bei Schmerzen, Verletzungen oder Vorerkrankungen gilt: zuerst ärztliche bzw. physiotherapeutische Abklärung.</p></div>';
  return h;
}

/* ---------- Formular ---------- */
function fld(label, inner, help, cls) { return '<label class="field ' + (cls || '') + '"><span>' + label + '</span>' + inner + (help ? '<span class="help">' + help + '</span>' : '') + '</label>'; }
function inp(path, type, attrs) { const v = getPath(S.draft, path); return '<input type="' + (type || 'text') + '" data-b="' + path + '" value="' + esc(v) + '" ' + (attrs || '') + '>'; }
function sel(path, opts, attrs) { const v = String(getPath(S.draft, path)); return '<select data-b="' + path + '" ' + (attrs || '') + '>' + opts.map(o => '<option value="' + esc(o[0]) + '"' + (String(o[0]) === v ? ' selected' : '') + '>' + esc(o[1]) + '</option>').join('') + '</select>'; }
function chips(path, opts, radio) { const v = getPath(S.draft, path); return '<div class="chips" role="group">' + opts.map(o => '<label class="chip"><input type="' + (radio ? 'radio' : 'checkbox') + '" name="' + path + '" data-' + (radio ? 'b' : 'arr') + '="' + path + '" value="' + esc(o[0]) + '"' + ((radio ? v === o[0] : (v || []).includes(o[0])) ? ' checked' : '') + '><span>' + esc(o[1]) + '</span></label>').join('') + '</div>'; }
function getPath(o, p) { return p.split('.').reduce((x, k) => x == null ? x : x[k], o); }
function setPath(o, p, v) { const ks = p.split('.'); const last = ks.pop(); const t = ks.reduce((x, k) => x[k], o); t[last] = v; }

    });

  } else if (i === 5) {

    h += '<div class="grid" style="margin-top:16px">' + fld('Details zu Beschwerden <em>(optional)</em>', '<textarea data-b="complaintNote">' + esc(d.complaintNote) + '</textarea>') + fld('Andere Sportarten', '<textarea data-b="otherSports" placeholder="z. B. 1× Laufen, Schulsport">' + esc(d.otherSports) + '</textarea>') + '</div>';

function validateStep(i) {
  const d = S.draft;
  if (i === 0) { if (!String(d.name).trim()) return 'Bitte einen Namen eintragen.'; if (!(+d.age >= 6 && +d.age <= 90)) return 'Bitte ein Alter zwischen 6 und 90 eintragen.'; if (d.climbYears === '' || +d.climbYears < 0) return 'Bitte die Klettererfahrung in Jahren eintragen (0 ist möglich).'; }
  if (i === 1) { if (!d.disciplines.length) return 'Bitte mindestens eine Disziplin wählen.'; }
  if (i === 3) { if (!d.startDate) return 'Bitte einen Planstart wählen.'; if (d.goalDate && parseDate(d.goalDate) <= parseDate(d.startDate)) return 'Das Zieldatum muss nach dem Planstart liegen.'; }
  if (i === 4) { if (!d.days.some(x => x.avail) && !d.fixed.length) return 'Bitte mindestens einen verfügbaren Tag markieren.'; }
  return '';
}

function createPlan() {
  for (let k = 0; k < STEPS.length - 1; k++) { const e = validateStep(k); if (e) { S.step = k; S.err = e; render(); return; } }
  const d = JSON.parse(JSON.stringify(S.draft));
  d.age = +d.age; d.fixed = d.fixed.map(f => Object.assign({}, f, { day: +f.day, dur: +f.dur }));
  let a = S.cur ? S.athletes[S.cur] : null;
  const plan = generatePlan(d);
  if (a && a.plan && a.plan.start === plan.start) {
    const t = todayIdx(a.plan);
    const keep = a.plan.sessions.filter(s => s.day < t);
    plan.sessions = keep.concat(plan.sessions.filter(s => s.day >= t));
    const keepIds = new Set(keep.map(s => s.id).concat(keep.map(s => s.id + 'n')));
    Object.keys(a.log || {}).forEach(id => { if (!keepIds.has(id)) delete a.log[id]; });
    a.profile = d; a.plan = plan;
  } else {
    if (!a) { a = { id: uid(), created: new Date().toISOString() }; S.athletes[a.id] = a; }
    a.profile = d; a.plan = plan; a.log = {}; a.ai = null;
  }
  S.cur = a.id; S.view = 'plan'; S.tab = 'week';
  const t = todayIdx(plan); S.week = clamp(Math.floor(t / 7), 0, plan.weeks.length - 1);
  S.err = ''; markDirty(); render(); window.scrollTo(0, 0);
  saveCurrent();
}

function viewPlan() {
  const a = S.athletes[S.cur]; const p = a.profile, plan = a.plan; const perm = permsOf(p);

  h += '<div class="tabs" role="tablist">' + [['week', 'Wochenplan'], ['over', 'Überblick & Steuerung'], ['profile', 'Profil']].map(t => '<button role="tab" data-a="tab" data-t="' + t[0] + '" aria-selected="' + (S.tab === t[0]) + '">' + t[1] + '</button>').join('') + '<span class="tabsp"></span><button class="btn ghost sm pdfbtn" data-a="pdf">PDF herunterladen</button></div>';

  else if (S.tab === 'over') h += viewOver(a, rs);

function viewWeek(a, rs, wk, bl) {
  const plan = a.plan, log = a.log || {};
  const t = todayIdx(plan);

function factorBar(f) { const pc = Math.round(f * 100); const col = f > 1.02 ? 'var(--ok)' : f < 0.98 ? 'var(--gold)' : 'var(--blue)'; return '<span style="display:inline-flex;align-items:center;gap:8px"><span style="display:inline-block;width:90px;height:8px;background:var(--soft);border-radius:4px;overflow:hidden"><i style="display:block;height:100%;width:' + clamp((f - 0.6) / 0.9 * 100, 3, 100) + '%;background:' + col + '"></i></span><b>' + pc + ' %</b></span>'; }

function loadChart(plan, rs, log) {
  const L = weekLoads(plan, rs, log); const n = L.length;
  const W = 520, H = 200, pl = 40, pb = 26, pt = 10; const max = Math.max(1, ...L.map(x => Math.max(x.planned, x.actual))) * 1.1;

function radar(p) {

  g += '<polygon points="' + R.map((x, i) => pt(i, +p.ratings[x[0]] || 0).join(',')).join(' ') + '" fill="rgba(24,186,232,.28)" stroke="#0E71AC" stroke-width="2"/>';

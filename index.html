  if (A === 'close') { closeTimer(); return; }
  if (A === 'main') {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (er) { } }
    if (actx && actx.state === 'suspended') actx.resume();
    if (!TT.started) { TT.started = true; TT.running = true; beep(990, 0.25, 0.3); lockWake(true); startTick(); }
    else if (TT.running) { TT.running = false; stopTick(); lockWake(false); }
    else { TT.running = true; lockWake(true); startTick(); }
    drawTimer(); return;
  }
  if (A === 'next' || A === 'skip') { if (!TT.started) { TT.started = true; TT.running = true; startTick(); } goPhase(TT.i + 1); return; }
  if (A === 'prev') { goPhase(TT.i - 1); return; }
  if (A === 'reset') { stopTick(); TT.running = false; TT.started = false; TT.beeped = {}; TT.i = 0; TT.left = TT.phases[0].sec * 1000; TT.manualMs = 0; lockWake(false); drawTimer(); return; }
});
document.addEventListener('keydown', e => { if (TT && e.key === 'Escape') closeTimer(); else if (e.key === 'Escape') { const d = $('#pdfdlg'); if (d && !d.hidden) closePdfDialog(); } });

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const A = el.dataset.a;
  if (A === 'import') return;
  if (A === 'home') { if (S.view === 'plan' && S.dirty) saveCurrent(); S.view = 'home'; render(); window.scrollTo(0, 0); }
  else if (A === 'new') { S.cur = null; S.draft = newProfile(); S.step = 0; S.err = ''; S.view = 'form'; render(); window.scrollTo(0, 0); }
  else if (A === 'edit') { S.cur = el.dataset.id; S.draft = JSON.parse(JSON.stringify(S.athletes[S.cur].profile)); S.step = 0; S.err = ''; S.view = 'form'; render(); window.scrollTo(0, 0); }
  else if (A === 'open') { S.cur = el.dataset.id; const pl = S.athletes[S.cur].plan; S.view = 'plan'; S.tab = 'week'; S.week = clamp(Math.floor(todayIdx(pl) / 7), 0, pl.weeks.length - 1); S.dirty = false; S.savedAt = null; render(); window.scrollTo(0, 0); }
  else if (A === 'step') { const k = +el.dataset.i; if (k > S.step) { const er = validateStep(S.step); if (er) { S.err = er; render(); return; } } S.err = ''; S.step = k; render(); window.scrollTo(0, 0); }
  else if (A === 'next') { const er = validateStep(S.step); S.err = er; if (!er) S.step++; render(); if (!er) window.scrollTo(0, 0); }
  else if (A === 'prev') { S.err = ''; S.step--; render(); window.scrollTo(0, 0); }
  else if (A === 'rate') { S.draft.ratings[el.dataset.k] = +el.dataset.v; render(); }
  else if (A === 'addfix') { S.draft.fixed.push({ id: uid(), day: 1, type: 'gruppe', dur: 120, intensity: 'mittel', label: '' }); render(); }
  else if (A === 'delfix') { S.draft.fixed.splice(+el.dataset.i, 1); render(); }
  else if (A === 'generate') createPlan();
  else if (A === 'save') saveCurrent();
  else if (A === 'tab') { S.tab = el.dataset.t; render(); }
  else if (A === 'wk') { S.week = clamp(S.week + +el.dataset.d, 0, S.athletes[S.cur].plan.weeks.length - 1); render(); }
  else if (A === 'gowk') { S.week = +el.dataset.w; S.tab = 'week'; render(); window.scrollTo(0, 0); }
  else if (A === 'today') { S.week = clamp(Math.floor(todayIdx(S.athletes[S.cur].plan) / 7), 0, S.athletes[S.cur].plan.weeks.length - 1); render(); const el2 = document.querySelector('.day.today'); if (el2) el2.scrollIntoView({ block: 'start' }); }
  else if (A === 'st') { const v = el.dataset.v; const id = el.dataset.id; const cur = (S.athletes[S.cur].log || {})[id]; if (!v || (cur && cur.status === v)) setLog(id, null); else setLog(id, v === 'missed' ? { status: 'missed', rpe: null, pain: null } : { status: 'done' }); }
  else if (A === 'rpe') setLog(el.dataset.id, { status: 'done', rpe: +el.dataset.v });
  else if (A === 'pain') setLog(el.dataset.id, { status: 'done', pain: el.dataset.v });
  else if (A === 'export') exportCurrent();
  else if (A === 'del') { if (confirm('Profil, Plan und alle Rückmeldungen endgültig löschen?')) deleteAthlete(el.dataset.id); }
  else if (A === 'ai') runAI();
  else if (A === 'timer') openTimer(el.dataset.k);
  else if (A === 'addx') { S.addDay = +el.dataset.day; S.addForm = { kind: 'bouldern_locker', dur: 60, rpe: 6, pain: 'gruen', note: '' }; const y = window.scrollY; render(); window.scrollTo(0, y); }
  else if (A === 'cancelx') { S.addDay = null; const y = window.scrollY; render(); window.scrollTo(0, y); }
  else if (A === 'xrpe') { S.addForm.rpe = +el.dataset.v; const y = window.scrollY; render(); window.scrollTo(0, y); }
  else if (A === 'xpain') { S.addForm.pain = el.dataset.v; const y = window.scrollY; render(); window.scrollTo(0, y); }
  else if (A === 'savex') { const f = S.addForm, day = S.addDay; S.addDay = null; changeExtras(ex => ex.push({ id: uid(), day, kind: f.kind, dur: +f.dur, rpe: +f.rpe, pain: f.pain, note: f.note || '', ts: new Date().toISOString() })); }
  else if (A === 'delx') { if (confirm('Nachgetragene Einheit entfernen?')) changeExtras(ex => { const i = ex.findIndex(x => x.id === el.dataset.id); if (i >= 0) ex.splice(i, 1); }); }
  else if (A === 'pdf') openPdfDialog();
  else if (A === 'alt') { S.altOpen = S.altOpen === el.dataset.id ? null : el.dataset.id; const y = window.scrollY; render(); window.scrollTo(0, y); }
  else if (A === 'setalt') { const id = el.dataset.id, v = el.dataset.v; changeAlts(al => { al[id] = v; }); }
  else if (A === 'undoalt') { const id = el.dataset.id; changeAlts((al, a) => { delete al[id]; if (a.log && a.log[id] && a.log[id].status === 'missed') delete a.log[id]; }); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.a === 'import' && t.files && t.files[0]) { importFile(t.files[0]); t.value = ''; return; }
  if (t.dataset.arr) { const arr = getPath(S.draft, t.dataset.arr); const v = t.value; const i = arr.indexOf(v); if (t.checked && i < 0) arr.push(v); if (!t.checked && i >= 0) arr.splice(i, 1); if (t.dataset.arr === 'disciplines' && !arr.includes(S.draft.mainDisc) && arr.length) S.draft.mainDisc = arr[0]; render(); return; }
  if (t.dataset.b) { setPath(S.draft, t.dataset.b, t.type === 'checkbox' ? t.checked : t.value); if (t.tagName === 'SELECT' || t.type === 'checkbox' || t.type === 'radio' || t.type === 'date' || t.dataset.b === 'age') render(); return; }
  if (t.dataset.xf) { S.addForm[t.dataset.xf] = t.value; return; }
  if (t.dataset.chk) { const [sid, key] = t.dataset.chk.split('|'); setCheck(sid, key, t.checked); return; }
  if (t.dataset.note) { const a = S.athletes[S.cur]; if (a.log[t.dataset.note]) { a.log[t.dataset.note].note = t.value; markDirty(); } }
});
document.addEventListener('input', e => { const t = e.target; if (t.dataset.xf && S.addForm) S.addForm[t.dataset.xf] = t.value; if (t.dataset.b && t.tagName !== 'SELECT' && t.type !== 'checkbox' && t.type !== 'radio') setPath(S.draft, t.dataset.b, t.value); });
document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 's' && S.view === 'plan') { e.preventDefault(); saveCurrent(); } });
window.addEventListener('beforeunload', e => { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });

/* ---------- Start ---------- */
S.athletes = lsRead();
document.getElementById('logo-c').src = LOGO_C; document.getElementById('logo-w').src = LOGO_W;
render();
initCaps();

</script>
